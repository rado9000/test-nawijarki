; Firmware nawijarki (Pico RP2040): RPM z enkodera, konfiguracja TMC przez UART, STEP z hardware PWM.
; Sprzęt: docs/KONFIG_SPRZETOWY.txt — I2C LCD na GP0/GP1 (rdzeń earlephilhower).
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
  teemuatlut/TMCStepper@^0.7.3
  marcoschwartz/LiquidCrystal_I2C@^1.1.2
