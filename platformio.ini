; Firmware nawijarki: wybór RPM enkoderem, płynny rozruch silnika krokowego, oszczędne odświeżanie LCD w trakcie pracy.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  waspinator/AccelStepper@^1.64.0
  marcoschwartz/LiquidCrystal_I2C@^1.1.2
